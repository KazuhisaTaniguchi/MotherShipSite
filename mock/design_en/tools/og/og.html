<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#142651;
 background:radial-gradient(60% 70% at 88% 18%,rgba(56,175,238,.45),transparent 70%),radial-gradient(50% 60% at 10% 100%,rgba(56,92,244,.18),transparent 70%),linear-gradient(160deg,#e9eefa 0%,#cde3fb 60%,#e5ebf4 100%);position:relative}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:30px;letter-spacing:.14em}
.brand svg{width:56px;height:56px}
h1{position:absolute;left:72px;top:150px;font-size:62px;font-weight:800;line-height:1.1;letter-spacing:-.025em}
h1 span{background:linear-gradient(100deg,#1e3ec0,#385cf4 45%,#38afee);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{position:absolute;left:76px;top:378px;font-size:27px;line-height:1.4;font-weight:600;color:#2b3a5e}
.chips{position:absolute;left:72px;top:482px;display:flex;gap:12px}
.chips b{padding:10px 20px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid #d3dced;font-size:21px;font-weight:700;color:#3a4766}
.url{position:absolute;left:76px;bottom:44px;font-size:20px;font-weight:700;color:#5a6785;letter-spacing:.04em}
/* 右：iPad に映る Mac の画面 */
.pad{position:absolute;right:52px;top:100px;width:300px;height:330px;border:15px solid #10162a;border-radius:30px;background:linear-gradient(160deg,#c9d8f4,#eaf0fb);overflow:hidden;box-shadow:0 40px 80px -30px rgba(20,38,81,.55);transform:rotate(-4deg)}
.bar{height:20px;background:rgba(255,255,255,.75)}
.w{position:absolute;background:#fff;border-radius:10px;box-shadow:0 12px 26px -14px rgba(20,38,81,.5);overflow:hidden}
.w1{left:14px;top:36px;width:122px;bottom:60px}.hinge{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(20,38,81,.14)}.w1 b{display:block;height:18px;background:#142651}
.w1 i{display:block;height:9px;margin:12px 14px 0;border-radius:5px;background:#28508f}.w1 i:nth-of-type(2){width:60%}.w1 i:nth-of-type(3){width:74%;background:#8fb0e8}
.w2{right:14px;top:66px;width:122px;bottom:60px;display:flex;align-items:flex-end;gap:10px;padding:0 16px 14px}.w2 em{flex:1;background:#8fb0e8;border-radius:4px 4px 0 0}
.w2 em:nth-child(1){height:40%}.w2 em:nth-child(2){height:65%}.w2 em:nth-child(3){height:50%}.w2 em:nth-child(4){height:88%;background:#385cf4}
.vb{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:9px;padding:7px 10px;border-radius:99px;background:rgba(20,32,58,.9)}
.vb i{width:26px;height:26px;border-radius:50%;background:#263257;display:grid;place-items:center;font-size:14px;font-style:normal}.vb i:first-child{background:#e5484d}
.say{position:absolute;right:48px;top:456px;padding:16px 22px;border-radius:22px 22px 6px 22px;background:#fff;box-shadow:0 20px 40px -20px rgba(20,38,81,.5);font-size:22px;font-weight:700;color:#142651}
</style></head><body>
<div class="brand"><svg viewBox="0 0 128 128"><defs><linearGradient id="bm" x2="1" y2="1"><stop stop-color="#1e3ec0"/><stop offset=".55" stop-color="#385cf4"/><stop offset="1" stop-color="#38afee"/></linearGradient></defs><rect width="128" height="128" rx="27" fill="url(#bm)"/><path d="M60 28 22 86 49 80 60 91 60 75 48 70 60 54Z" fill="#fff"/><path d="M68 28 106 86 79 80 68 91 68 75 80 70 68 54Z" fill="#a8f8ff"/><path d="M64 86 72 98 64 105 56 98Z" fill="#fff"/></svg>MOTHERSHIP</div>

<p class="lead">Unfold it, and your Mac's screen is right there.<br>Need a change? Just say it.</p>
<div class="chips"><b>Tested on Galaxy Z Fold7</b><b>One-time purchase</b><b>Free for 14 days</b></div>
<p class="url">mothershipremote.com</p>
<div class="pad"><div class="bar"></div><i class="hinge"></i><div class="w w1"><b></b><i></i><i></i><i></i></div><div class="w w2"><em></em><em></em><em></em><em></em></div><div class="vb"><i>🎤</i><i></i><i></i><i></i></div></div>
<p class="say">🎤 “Fix the chart, please.”</p>
</body></html>
