# Next.js（frontend）をビルドして、エックスサーバーの mothershipremote.com へ置く
# きっかけ：WordPress で公開中の記事・固定ページが変わったとき（repository_dispatch）、
#           frontend/ のコードを main に push したとき、手動（Actions タブの Run workflow）
name: Build & Deploy frontend

on:
  repository_dispatch:
    types: [wordpress-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

# 続けて保存されたときは、古いビルドを止めて最新の 1 回だけ実行する
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read

env:
  SSH_HOST: xs082238.xsrv.jp
  SSH_PORT: "10022"
  SSH_USER: xs082238
  DEPLOY_PATH: /home/xs082238/mothershipremote.com/public_html/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          WORDPRESS_GRAPHQL_ENDPOINT: https://api.mothershipremote.com/graphql
          NEXT_PUBLIC_SITE_URL: https://mothershipremote.com
          # お問い合わせフォームの送信先（WordPress の Contact Form 7「Mothership お問い合わせ」の投稿 ID。秘密ではない）
          NEXT_PUBLIC_WORDPRESS_URL: https://api.mothershipremote.com
          NEXT_PUBLIC_CF7_CONTACT_FORM_ID: "13"
          # 英語のお問い合わせ（/en/contact/）の送信先。Contact Form 7 の英語用のフォームの投稿 ID（空にすると、送らずに「準備中」と出す）
          NEXT_PUBLIC_CF7_CONTACT_FORM_ID_EN: "23"
          # reCAPTCHA v3 のサイトキー（公開してよい値。シークレットキーは WordPress の Contact Form 7 に入れる。ここには書かない）。空にすると reCAPTCHA を使わない
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "6Lf45youAAAAAKkEH_lsuAFgDnr55iyrDo5nZh9c"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: SSH の準備
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # 接続だけを先に試す。失敗したときに、どの段階で切られたかがログでわかる（-v）
      - name: 接続テスト
        run: |
          echo "ランナーの IP: $(curl -s https://api.ipify.org)"
          ssh -v -o BatchMode=yes -o ConnectTimeout=20 -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" 'echo CONNECTED'

      # 重要：public_html の中には WordPress（api.mothershipremote.com/）がある。
      # --delete で消さないよう、Next.js 以外のものは必ず除外する（先頭の / は public_html 直下の意味）。
      - name: エックスサーバーへアップロード
        run: |
          rsync -rlz --delete --checksum \
            --exclude='/api.mothershipremote.com/' \
            --exclude='/.htaccess' \
            --exclude='/.user.ini' \
            --exclude='/default_page.png' \
            --exclude='/.well-known/' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy" \
            out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      - name: 後片付け
        if: always()
        run: rm -f ~/.ssh/id_deploy
