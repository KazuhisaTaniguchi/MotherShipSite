# Next.js（frontend）をビルドして、エックスサーバーの mothershipremote.com へ置く
# きっかけ：WordPress で公開中の記事・固定ページが変わったとき（repository_dispatch）、
#           手動（Actions タブの Run workflow）
# コードの変更は、手元の frontend/deploy.sh で出す（push しただけではデプロイしない）。
# どちらも GitHub の main のコードを出すので、本番はいつも main と同じになる。
name: Build & Deploy frontend

on:
  repository_dispatch:
    types: [wordpress-updated]
  workflow_dispatch:

# 続けて保存されたときは、古いビルドを止めて最新の 1 回だけ実行する
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read

env:
  SSH_HOST: xs082238.xsrv.jp
  SSH_PORT: "10022"
  SSH_USER: xs082238
  DEPLOY_PATH: /home/xs082238/mothershipremote.com/public_html/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          WORDPRESS_GRAPHQL_ENDPOINT: https://api.mothershipremote.com/graphql
          NEXT_PUBLIC_SITE_URL: https://mothershipremote.com
          NEXT_TELEMETRY_DISABLED: "1"

      - name: SSH の準備
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # 接続だけを先に試す。失敗したときに、どの段階で切られたかがログでわかる（-v）
      - name: 接続テスト
        run: |
          echo "ランナーの IP: $(curl -s https://api.ipify.org)"
          ssh -v -o BatchMode=yes -o ConnectTimeout=20 -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" 'echo CONNECTED'

      # 重要：public_html の中には WordPress（api.mothershipremote.com/）がある。
      # --delete で消さないよう、除外の一覧は deploy-exclude.txt（deploy.sh と共通）から読む。
      - name: エックスサーバーへアップロード
        run: |
          grep -q '^/api\.mothershipremote\.com/$' deploy-exclude.txt \
            || { echo "deploy-exclude.txt に WordPress の除外がありません。中止します"; exit 1; }
          [ -f out/index.html ] && [ -d out/_next ] \
            || { echo "out/ にサイトが書き出されていません。中止します"; exit 1; }
          rsync -rlz --delete --checksum --exclude-from=deploy-exclude.txt \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_deploy" \
            out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      - name: 後片付け
        if: always()
        run: rm -f ~/.ssh/id_deploy
